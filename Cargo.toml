[package]
name = "clustering_federated"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
rand = "0.8"
process_mining = "0.3"
linfa = "0.7"
linfa-clustering = "0.7"
ndarray = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand_xoshiro = "0.6"
rand_chacha = "0.3"
# SIGINT/SIGTERM/SIGHUP run the same secret-material wipe as the Drop guard.
ctrlc = { version = "=3.5.2", features = ["termination"] }
# Only for `kill(2)` on the spawned party children.
libc = "=0.2.189"
